# OpsHub nginx vhost — to be installed at:
#   /etc/nginx/sites-available/opshub  (on 100.91.194.83)
# After symlinking into sites-enabled, run:
#   sudo certbot --nginx -d opshub.pcc2k.com --non-interactive --agree-tos -m msaville.pcc2k@gmail.com --redirect
# certbot will rewrite this file to add the TLS server block + HTTP→HTTPS redirect.
server {
    listen 80;
    server_name opshub.pcc2k.com;

    location / {
        proxy_pass http://100.115.11.109:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for next-auth long-poll + Phase 2 agent connection
        # (the WSS gateway will live behind the same vhost on /agent/connect).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size 8m;
    }
}
